name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo-leptos
            target
          key: site-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: site-${{ runner.os }}-

      - name: Install cargo-leptos
        run: command -v cargo-leptos || cargo install cargo-leptos --version 0.3.11 --locked

      - name: Test
        run: cargo test --features ssr --no-default-features

      - name: Build the site
        run: |
          rm -rf target/site
          cargo leptos build --release
          ./target/release/daltoncole
          find target/site/pkg -name '*.d.ts' -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
